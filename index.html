const $=id=>document.getElementById(id);const groupNames=['すべて','送り仮名だけ','地名だけ',...new Set(entries.map(e=>e.category))];$('group').innerHTML=groupNames.map(g=>'<option>'+g+'</option>').join('');function selectedOrder(){return entries.map((e,i)=>[e,i]).filter(([e,i])=>$('group').value==='すべて'||($('group').value==='送り仮名だけ'&&i>=200&&i<400)||($('group').value==='地名だけ'&&i>=400)||e.category===$('group').value).map(([,i])=>i)}let order=selectedOrder(),position=0,mode='study',shown=false,correct=0,attempts=0;function normalize(s){return s.trim().normalize('NFKC').replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).replace(/[\sー・]/g,'')}function render(){const e=entries[order[position]];shown=false;$('word').textContent=e.word;$('category').textContent=e.category;$('result').hidden=true;$('reading').value='';$('feedback').textContent='';$('progress').textContent=mode==='study'?`${position+1} / ${order.length}`:`${position+1} / ${order.length}　正解 ${correct} / ${attempts}`;$('study').hidden=mode!=='study';$('quiz').hidden=mode!=='quiz';$('studyTab').classList.toggle('active',mode==='study');$('quizTab').classList.toggle('active',mode==='quiz')}
function show(){const e=entries[order[position]];shown=true;$('answer').textContent=e.read==='こーひー'?'コーヒー':e.read;$('meaning').textContent='　'+e.meaning;$('originBlock').hidden=true;$('origin').textContent=e.origin;$('reason').textContent=e.reason;$('source').textContent=e.source;$('source').href=e.url;$('result').hidden=false}function next(){position++;if(position===order.length){position=0;if(mode==='quiz')order=order.sort(()=>Math.random()-.5)}render()}function switchMode(m){mode=m;position=0;correct=0;attempts=0;order=selectedOrder();if(m==='quiz')order.sort(()=>Math.random()-.5);render()}$('group').onchange=()=>switchMode(mode);$('studyTab').onclick=()=>switchMode('study');$('quizTab').onclick=()=>switchMode('quiz');$('reveal').onclick=show;$('quizReveal').onclick=show;$('next').onclick=next;$('quizNext').onclick=next;$('check').onclick=()=>{if(shown)return;const v=normalize($('reading').value);if(!v){$('feedback').textContent='読みを入力してください。';return}attempts++;const ok=v===normalize(entries[order[position]].read);if(ok)correct++;$('feedback').textContent=ok?'正解です！':'もう一度、読みと由来を確認しましょう。';$('progress').textContent=`${position+1} / ${order.length}　正解 ${correct} / ${attempts}`;show()};$('reading').addEventListener('keydown',e=>{if(e.key==='Enter')$('check').click()});render();
